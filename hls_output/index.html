<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>HLS XOR 加密串流</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a1a1a; color: #ccc; padding: 20px; }
        h1 { margin: 20px; color: #fff; }
        video { width: 80%; max-width: 800px; background: #000; border-radius: 8px; }
        .info { margin-top: 20px; padding: 15px; background: #2a2a2a; border-radius: 4px; max-width: 600px; text-align: center; }
        .btn { padding: 12px 24px; margin-top: 15px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
        .btn:hover { background: #45a049; }
        .key { color: #ffd700; font-weight: bold; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>🎬 HLS 加密串流</h1>
    <video id="video" controls autoplay muted playsinline></video>
    <div class="info" id="info">
        🔑 XOR 金鑰: <span class="key">0x5a</span>
        <br>📦 共 1 個分片
        <br><span style="color:#888;font-size:14px;">💡 使用下方 Bookmarklet 還原下載</span>
    </div>
    <button class="btn" id="downloadBtn">📥 下載並還原原始檔案</button>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', async function() {
            const info = document.getElementById('info');
            info.innerHTML = '⏳ 正在下載並還原...';
            try {
                const baseUrl = './';
                const resp = await fetch(baseUrl + 'manifest.json');
                if (!resp.ok) throw new Error('無法獲取 manifest');
                const manifest = await resp.json();
                
                const chunks = [];
                for (const f of manifest.files) {
                    const segResp = await fetch(baseUrl + f);
                    if (!segResp.ok) throw new Error('下載失敗: ' + f);
                    const segBuf = await segResp.arrayBuffer();
                    chunks.push(new Uint8Array(segBuf));
                }

                // 合併所有分片
                const totalLen = chunks.reduce((sum, arr) => sum + arr.length, 0);
                const full = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) {
                    full.set(chunk, offset);
                    offset += chunk.length;
                }

                // 解密 TS 封包 payload
                const decrypted = new Uint8Array(full.length);
                let writeOffset = 0;
                for (let i = 0; i < full.length; i += 188) {
                    const packet = full.slice(i, i + 188);
                    if (packet.length < 188) break;
                    const header = packet.slice(0, 4);
                    const payload = packet.slice(4);
                    for (let j = 0; j < payload.length; j++) {
                        payload[j] = payload[j] ^ manifest.xor_key;
                    }
                    decrypted.set(payload, writeOffset);
                    writeOffset += payload.length;
                }

                // 裁切掉多餘的 padding (最後一個封包可能有 0xff 填充)
                let dataEnd = writeOffset;
                while (dataEnd > 0 && decrypted[dataEnd - 1] === 0xff) {
                    dataEnd--;
                }
                const finalData = decrypted.slice(0, dataEnd);

                // 判斷檔案類型
                let ext = '.bin';
                if (finalData.length > 4) {
                    if (finalData[0] === 0x25 && finalData[1] === 0x50 && finalData[2] === 0x44 && finalData[3] === 0x46) ext = '.pdf';
                    else if (finalData[0] === 0x50 && finalData[1] === 0x4B) ext = '.zip';
                    else if (finalData[0] === 0x89 && finalData[1] === 0x50 && finalData[2] === 0x4E && finalData[3] === 0x47) ext = '.png';
                    else if (finalData[0] === 0xFF && finalData[1] === 0xD8 && finalData[2] === 0xFF) ext = '.jpg';
                    else if (finalData[0] === 0x25 && finalData[1] === 0x21) ext = '.ps';
                }

                const blob = new Blob([finalData]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'restored' + ext;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                info.innerHTML = '✅ 還原成功！檔案已下載';
            } catch (e) {
                info.innerHTML = '❌ 還原失敗: ' + e.message;
            }
        });
    </script>
</body>
</html>
